name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "bin/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --clean packaging/generador.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorPlanillasLCH-windows
          path: dist/GeneradorPlanillasLCH.exe
      - name: Release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Última versión" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          files: dist/GeneradorPlanillasLCH.exe
          draft: false
          prerelease: false
          make_latest: true
          body: |
            Ejecutable de Windows del Generador de Planillas LCH.

            1. Bajá `GeneradorPlanillasLCH.exe`.
            2. Doble clic. Si Windows avisa, tocá **Más info → Ejecutar de todas formas**.
            3. Se abre el navegador en http://127.0.0.1:43147.
            4. Tocá **Armar planillas**. Dejá la ventana negra abierta.
