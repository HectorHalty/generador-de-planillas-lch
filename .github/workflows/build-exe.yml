name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --clean packaging/generador.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorPlanillasLCH-windows
          path: dist/GeneradorPlanillasLCH.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeneradorPlanillasLCH.exe
